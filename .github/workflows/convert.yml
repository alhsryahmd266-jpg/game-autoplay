name: Convert user model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The checkpoint is a pickle file: it runs in a job with NO secrets, a read-only token and no stored credentials.
      - uses: actions/checkout@v4
        with:
          ref: convert-input
          persist-credentials: false
          path: input
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip wheel
          pip install ultralytics onnx onnxruntime
      - name: Convert
        run: |
          set +e
          python src/tools/convert_user_model.py input/weights.pt 2>&1 | tee convert.log
          if [ -z "$(ls out/autoplay-*.tflite 2>/dev/null)" ]; then
            echo "=== second pass (requirements were auto-installed in pass 1) ===" | tee -a convert.log
            python src/tools/convert_user_model.py input/weights.pt 2>&1 | tee -a convert.log
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: converted
          path: |
            out/autoplay-*
            convert.log
  publish:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: converted
          path: art
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          find art -type f | sort
          FILES=$(find art -name 'autoplay-*' -type f | sort | tr '\n' ' ')
          test -n "$FILES" || { echo "no outputs"; exit 1; }
          gh release delete model-user --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create model-user $FILES --repo "$GITHUB_REPOSITORY" --latest=false --title "Your trained model (converted)" --notes "Converted from the uploaded weights.pt. 288x640 variants match a 20:9 landscape screen (fastest); the square ones keep the training size."
      - name: Push log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -rf /tmp/lg && mkdir /tmp/lg && cp art/convert.log /tmp/lg/ 2>/dev/null
          cd /tmp/lg
          git init -q -b convert-logs
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "convert log"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" convert-logs
          exit 0
